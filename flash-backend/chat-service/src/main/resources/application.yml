server:
  port: 8085

spring:
  application:
    name: chat-service

  datasource:
    url: jdbc:postgresql://localhost:5432/chat_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    config:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.lomov.flash.chat: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG

websocket:
  allowed-origins: "*"
  broker:
    prefix: /topic
    app-prefix: /app
