server:
  port: 8084

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:postgresql://localhost:5432/media_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

storage:
  location: ./uploads/media

logging:
  level:
    ru.lomov.flashbackend: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
