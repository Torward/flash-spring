server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: api-docs-service
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/posts/**
          filters:
            - StripPrefix=1
        
        - id: story-service
          uri: lb://story-service
          predicates:
            - Path=/api/stories/**
          filters:
            - StripPrefix=1
        
        - id: groups-service
          uri: lb://groups-service
          predicates:
            - Path=/api/groups/**
          filters:
            - StripPrefix=1

# SpringDoc OpenAPI Configuration
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth-service
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Post Service
        url: /v3/api-docs/post-service
      - name: Story Service
        url: /v3/api-docs/story-service
      - name: Groups Service
        url: /v3/api-docs/groups-service
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  
  api-docs:
    enabled: true
    path: /v3/api-docs
  
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springdoc: DEBUG
    org.springframework.cloud.gateway: DEBUG
