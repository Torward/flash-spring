name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'flash-backend/**'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'flash-backend/**'

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.6'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # BUILD & TEST JOB
  # ===========================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: flash_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build with Maven
        run: |
          cd flash-backend
          mvn clean compile -DskipTests
      
      - name: Run unit tests
        run: |
          cd flash-backend
          mvn test -pl '!integration-tests'
      
      - name: Run integration tests
        run: |
          cd flash-backend/integration-tests
          mvn verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flash_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            flash-backend/**/target/surefire-reports/
            flash-backend/**/target/failsafe-reports/
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: flash-backend/**/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

  # ===========================================
  # CODE QUALITY JOB
  # ===========================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Run SonarQube Scan
        run: |
          cd flash-backend
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ github.repository }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        if: ${{ secrets.SONAR_TOKEN != '' }}
      
      - name: Checkstyle validation
        run: |
          cd flash-backend
          mvn checkstyle:check
        continue-on-error: true

  # ===========================================
  # DOCKER BUILD JOB
  # ===========================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - config-server
          - service-discovery
          - api-gateway
          - auth-service
          - user-service
          - post-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: flash-backend/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # DEPLOY TO STAGING JOB
  # ===========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Kubernetes (Staging)
        run: |
          echo "Deploying to staging environment..."
          # Add kubectl commands here
          # kubectl apply -f k8s/staging/
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_STAGING }}
      
      - name: Health check
        run: |
          echo "Running health checks on staging..."
          # curl -f https://staging.flash-social.com/actuator/health

  # ===========================================
  # DEPLOY TO PRODUCTION JOB
  # ===========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Kubernetes (Production)
        run: |
          echo "Deploying to production environment..."
          # Add kubectl commands here
          # kubectl apply -f k8s/production/
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
      
      - name: Smoke tests
        run: |
          echo "Running smoke tests on production..."
          # curl -f https://api.flash-social.com/actuator/health
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "Deployment to production completed successfully!"
          # Add Slack/Teams notification here
