spring:
  application:
    name: integration-tests
  
  datasource:
    url: jdbc:postgresql://localhost:5432/flash_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: false

logging:
  level:
    root: WARN
    ru.lomov.flash: DEBUG
    org.springframework: INFO
    org.testcontainers: INFO
    com.github.dockerjava: WARN

test:
  containers:
    postgres:
      image: postgres:15-alpine
      database-name: flash_test
      username: test
      password: test
