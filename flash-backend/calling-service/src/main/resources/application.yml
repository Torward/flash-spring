server:
  port: 8086

spring:
  application:
    name: calling-service
  datasource:
    url: jdbc:postgresql://localhost:5432/flash_calling
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  config:
    import: configserver:http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.lomov.flash.calling: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# WebSocket configuration
websocket:
  enabled: true
  endpoint: /ws
  allowed-origins: "*"

# Calling service specific configuration
calling:
  max-call-duration: 3600000  # 1 hour in milliseconds
  max-concurrent-calls: 10
  ice-servers:
    - urls: "stun:stun.l.google.com:19302"
    - urls: "stun:stun1.l.google.com:19302"
