# ===================================================================
# USER-SERVICE CONFIGURATION
# User Management Service
# Port: 8082
# ===================================================================

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service
  
  # Database configuration for user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST_USER:localhost}:${DB_PORT:5432}/${DB_NAME_USER:flash_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# File upload configuration
file:
  upload-dir: ${FILE_UPLOAD_DIR:/tmp/uploads/users}
  max-file-size: ${MAX_FILE_SIZE:5MB}
  max-request-size: ${MAX_REQUEST_SIZE:10MB}

# Avatar and profile settings
user:
  avatar:
    max-size-bytes: 5242880 # 5MB
    allowed-types: image/jpeg,image/png,image/gif,webp
  cover:
    max-size-bytes: 10485760 # 10MB
    allowed-types: image/jpeg,image/png,image/gif,webp

logging:
  level:
    ru.lomov.flashbackend.userservice: DEBUG
