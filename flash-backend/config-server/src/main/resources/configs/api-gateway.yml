# ===================================================================
# API-GATEWAY CONFIGURATION
# Central API Gateway for all microservices
# Port: 8080
# ===================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  
  # Cloud Gateway configuration
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET,POST
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
      
      routes:
        # Auth Service Routes
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        
        # User Service Routes
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        
        # Post Service Routes
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/posts/**
          filters:
            - StripPrefix=1
        
        # Story Service Routes
        - id: story-service
          uri: lb://story-service
          predicates:
            - Path=/api/stories/**
          filters:
            - StripPrefix=1
        
        # Groups Service Routes
        - id: groups-service
          uri: lb://groups-service
          predicates:
            - Path=/api/groups/**
          filters:
            - StripPrefix=1
        
        # Notification Service Routes
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        
        # Media Service Routes
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
          filters:
            - StripPrefix=1
        
        # Chat Service Routes
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1
        
        # Reels Service Routes
        - id: reels-service
          uri: lb://reels-service
          predicates:
            - Path=/api/reels/**
          filters:
            - StripPrefix=1
        
        # Product Service Routes
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        
        # Balance Service Routes
        - id: balance-service
          uri: lb://balance-service
          predicates:
            - Path=/api/balance/**
          filters:
            - StripPrefix=1
        
        # WebSocket Service Routes
        - id: websocket-service
          uri: lb://websocket-service
          predicates:
            - Path=/api/ws/**
          filters:
            - StripPrefix=1

# CORS Configuration for Gateway
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  exposed-headers: Authorization,X-Auth-Token
  allow-credentials: true
  max-age: 3600

# Resilience4j Circuit Breaker (will be configured in detail later)
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      auth-service:
        baseConfig: default
      user-service:
        baseConfig: default

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
