# ===================================================================
# SPRING CLOUD SLEUTH & ZIPKIN DISTRIBUTED TRACING CONFIGURATION
# For tracking requests across microservices
# ===================================================================

# Spring Cloud Sleuth configuration (now part of Micrometer Tracing in Spring Boot 3.x)
management:
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0} # 1.0 = sample all requests
  
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing

# Logging configuration for tracing
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  
  level:
    org.springframework.cloud.sleuth: DEBUG
    io.micrometer.tracing: DEBUG

# Custom tags for traces
management.tracing.tags:
  application: ${spring.application.name}
  environment: ${SPRING_PROFILES_ACTIVE:development}
