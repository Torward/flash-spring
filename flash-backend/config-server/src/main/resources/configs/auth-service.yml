# ===================================================================
# AUTH-SERVICE CONFIGURATION
# Authentication and Authorization Service
# Port: 8081
# ===================================================================

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  
  # Database configuration for auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST_AUTH:localhost}:${DB_PORT:5432}/${DB_NAME_AUTH:flash_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSecretKeyForJWTTokenGenerationMustBeLongEnoughAndSecure2024}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  issuer: flash-social-network
  audience: flash-apps

# Security configuration
security:
  password-strength: 8
  max-login-attempts: 5
  lock-time-minutes: 30

# CORS configuration (if needed at service level)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

logging:
  level:
    ru.lomov.flashbackend.authservice: DEBUG
    org.springframework.security: DEBUG
