server:
  port: 8089

spring:
  application:
    name: balance-service
  datasource:
    url: jdbc:postgresql://localhost:5432/flashdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

logging:
  level:
    ru.lomov.flash.balance: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Prohibition notice: NO Firebase or AWS services allowed
# This service implements Firebase-compatible balance management without Firebase dependencies
