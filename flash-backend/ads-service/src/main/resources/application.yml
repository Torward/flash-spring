server:
  port: 8087

spring:
  application:
    name: ads-service
  datasource:
    url: jdbc:postgresql://localhost:5432/flash_ads
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  config:
    import: configserver:http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.lomov.flash.ads: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Ads service specific configuration
ads:
  max-impressions-per-day: 1000
  max-clicks-per-day: 100
  default-cpm-rate: 0.50
  supported-formats:
    - BANNER
    - INTERSTITIAL
    - NATIVE
    - VIDEO
